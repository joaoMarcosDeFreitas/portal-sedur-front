	<script language="JavaScript" type="text/javascript">

		$(document).ready(function(){
			$("#img_preload").hide();
			$("#resultPesquisa").hide();
			$("#Numero_DAMInforma").focus();
		});


		function opcaoItensProcesso( opcao ){
			$("#OrigemInf").attr({disabled: opcao});
			$("#Numero_DAMInforma").attr({disabled: opcao});
			$("#Ano_ExercicioInf").attr({disabled: opcao});
			$("#Digito_DamInf").attr({disabled: opcao});
			$("#Chave_Seguranca").attr({disabled: opcao});
		}
		
		function pontosDAM(valorPago, vencDam){
		    parametro = "ValorPago="+valorPago+"&VencDam="+vencDam;
			parametro = parametro + "&acao=OBTERPONTOSDAMPUBLICIDADE";
			//alert(parametro);
		
			$.ajax({
					type: "POST",
					url: "publicidade_post.php",
					data: parametro, //passagem dos parametros
					dataType: "json",					

					beforeSend: function(){$("#img_preload").show("fast");}, // Exibe preload
					complete: function(){$("#img_preload").hide("slow");},  // Oculta preload

					success: function(json){
						//alert(json.QtdPontos);
						$("#qtdPontos").val(json.QtdPontos);
						document.tela.submit();
						return true;
					},
					error: function(request, status, error){
						alert(request.responseText);	
						return false;
					}
				});
		}		


		function verificarDam(){
			$("#damsEmAberto").html("");
			$("#Numero_Processo").val("");
			
			//cga = replicate('0',14-$("#cga").val().length) + $("#cga").val();
			//cga = '%'+$("#cga").val();
			cga = $("#cga").val();
			
			$("#cga").val(cga);
			
			parametro = "cga="+cga ;
			parametro = parametro + "&acao=CONSULTA_DAMS_CGA";
			
			$("#resultPesquisa").hide();
			
			$.ajax({
				type: "POST",
				url: "viabilidade_post.php",
				data: parametro, //passagem dos parametros
				dataType: "json",

				beforeSend: function(){$("#img_preload").show("fast");}, // Exibe preload
				complete: function(){$("#img_preload").hide("slow");},  // Oculta preload

				success: function(json){				
					
					if( json.encontrados == 0 ){
						
						alert('Não foi encontrado DAM em aberto para o CGA informado! ');
						
					}else{
						$("#resultPesquisa").show();
						$('#resultTVL').show();
						$('#DAMSABERTOS').html( json.damsAbertos );

					}
						
						
					
				},
				error: function(request, status, error){
					alert( request.responseText );
					$("#Chave_Seguranca").val("");
					$("#Digito_DamInf").val("");
					$("#Numero_DAMInforma").val("").focus();
				}
			});
		}


		function validarProcesso(){
			OrDoc   = trim( $("#OrigemProcesso").val() );
			AnoDoc  = trim( $("#Ano_Processo").val() );
			NumDoc  = trim( $("#Numero_Processo").val() );

			if ( (OrDoc == "") || (AnoDoc == "") || (NumDoc == "") ){
				if(OrDoc == ""){
					alert($("#OrigemProcesso").val());
					$("#OrigemProcesso").focus();
				}else if(AnoDoc == ""){
					alert("Informe o Ano do Processo");
					$("#Ano_Processo").focus();
				}else if(NumDoc == "")
					alert("Informe o Numero do Processo");
					$("#Numero_Processo").focus();
			   }else{
				   parametro = "OrigemProcesso="+OrDoc+"&AnoProcesso="+AnoDoc+"&NumeroProc="+NumDoc+"&acao=VERIFICARPROCESSOTVL";
				   parametro = parametro+"&acao=CONSULTATVLCANCELADO";

				   //alert(parametro);

					$.ajax({
						type: "POST",
						url: "viabilidade_post.php",
						data: parametro, //passagem dos parametros
						dataType: "json",

						beforeSend: function(){$("#img_preload").show("fast");}, // Exibe preload
						complete: function(){$("#img_preload").hide("slow");},  // Oculta preload

						success: function(json){
							//alert(json.tvl);

							//alert(json.idDocumento);

							$("#servicoId").val('946');
							$("#NumeroTVL").val(json.tvl)


							verificaDamAbertoProcesso(json.idDocumento);
	                        /*
							if (confirm( "Confirma o Serviço Selecionado?" )){
								$("#servicoId").val('946');
								$("#NumeroTVL").val(json.tvl)
								opcaoItensProcesso( false );
								document.tela.submit();
							}

							*/

						},
						error: function(request, status, error){
							alert( request.responseText );
							$("#NumeroTVL").val("").focus();
						}
					});

			   }
		}
/////////////////////////////////////////////////////////////////////////////////////////////////////////
		function verificaDamAbertoProcesso(idProcesso){

		   parametro = "idProcesso="+idProcesso;
		   parametro = parametro+"&acao=OBTERDAMSABERTOSPROCESSO";

		   //alert(parametro);

			$.ajax({
				type: "POST",
				url: "viabilidade_post.php",
				data: parametro, //passagem dos parametros
				dataType: "json",

				beforeSend: function(){$("#img_preload").show("fast");}, // Exibe preload
				complete: function(){$("#img_preload").hide("slow");},  // Oculta preload

				success: function(json){

					//alert( request.responseText );
					if(json.existencia > 0){

					   $("#damsEmAberto").html( json.damsAbertos );

					}else{

						if (confirm( "Confirma o Serviço Selecionado?" )){
							opcaoItensProcesso( false );
							document.tela.submit();
						}

					}


				},
				error: function(request, status, error){
					alert( request.responseText );
				    //alert('ok');
					$("#NumeroTVL").val("").focus();
				}
			});




		}

		function validarTvl(){
			NumeroTvl = trim( $("#NumeroTVL").val() );
			if ( NumeroTvl == "" ){
				alert("Informe o TVL");
				$("#NumeroTVL").focus();
			}else{
				parametro = "NumeroTvl="+NumeroTvl+"&isRenovacao="+$("#isRenovacao").val()+"&servicoId="+$("#comboOutroServico").val()+"&acao=VERIFICARVALIDADETVL";
				$("#isRenovacaoAutomatica").val("");

				$.ajax({
					type: "POST",
					url: "viabilidade_post.php",
					data: parametro, //passagem dos parametros
					dataType: "json",

					beforeSend: function(){$("#img_preload").show("fast");}, // Exibe preload
					complete: function(){$("#img_preload").hide("slow");},  // Oculta preload

					success: function(json){
						   document.tela.submit();

					},
					error: function(request, status, error){
						alert( request.responseText );
						$("#NumeroTVL").val("").focus();
					}
				});
			}
		}


		function limpar(){
			opcaoItensProcesso( false );
			
			$("#cga").val("");
			$("#resultPesquisa").hide();
			$("#Numero_DAMInforma").val("").focus();
			$("#Digito_DamInf").val("");
			$("#NumeroTVL").val("");
			$("#Chave_Seguranca").val("");
			$("#Numero_Processo").val("");
			$("#damsEmAberto").html("");
		}


		function mudarActionOutroServico(valor){
			//direcionando para o formulário correspondente
			if ( valor == 385 ) {
				$('#tela').attr('action', 'cad_proc_srv_revisaotvl.php');
				$('#resultTVL').show();
				$('#resultProcesso').hide();
			}else if ( valor == 345 ){
				$("#isRenovacao").val("1");
				$('#tela').attr('action', 'cad_proc_srv_renovacaotvl.php');
				$('#resultTVL').show();
				$('#resultProcesso').hide();
			}else if ( valor == 722 ){
				$('#tela').attr('action', 'cad_proc_srv_incatividade.php');
				$('#resultTVL').show();
				$('#resultProcesso').hide();
			}else if ( valor == 946 ){
				$('#tela').attr('action', 'cad_proc_srv_tvlcancelado.php');
				$('#resultTVL').hide();
				$("#resultServico").html( "Dam referente ao serviço Emissão de TVL Cancelado<br/> Informe o número do processo" );
				$('#resultProcesso').show();
			}else if ( valor == 408 ){
				$('#tela').attr('action', 'cad_proc_srv_recondespacho.php');
				$('#resultTVL').hide();
				$("#resultServico").html( "Dam referente ao serviço Reconsideração de Despacho<br />Informe o número do processo" );
				$('#resultProcesso').show();
			}else if ( valor == 6771 ) {
				$('#tela').attr('action', 'cad_proc_srv_exclusaoatividadetvl.php');
				$('#resultTVL').show();
				$('#resultProcesso').hide();
			}else if ( valor == 6766 ) {
				$('#tela').attr('action', 'cad_proc_srv_alteracaorazaosocialtvl.php');
				$('#resultTVL').show();
				$('#resultProcesso').hide();
			}
			
		}
