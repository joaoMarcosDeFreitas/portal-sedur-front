		$(document).ready(function(){
			$("#img_preload").hide();

		});


		function consultarSE(){
			//parametro = getParams("table");
			parametro = "Numero_Documento="+document.getElementById("Numero_Documento").value;
			parametro = parametro + "&OrigemInf="+document.getElementById("OrigemInf").value;
			parametro = parametro + "&Ano_Documento="+document.getElementById("Ano_Documento").value;
			
			parametro = parametro + "&acao=VALIDARSE";
			
			//alert(parametro);			

			$.ajax({
				type: "POST",
				url: "viabilidade_post.php",
				data: parametro, //passagem dos parametros
				dataType: "json",

				beforeSend: function(){$("#img_preload").show("fast");}, // Exibe preload
				complete: function(){$("#img_preload").hide("slow");},  // Oculta preload

				success: function(json){
				    
					//alert("cod:"+json.documentoId);
					
					if ( json.documentoId != "" ){
						$("#paramDocumentoId").val(json.documentoId);
						document.tela.submit();
					}
				},
				error: function(request, status, error){
					alert( "SE não encontrada" );
					limpar();
				}
			});
		}


		function limpar(){
			$("#OrigemInf").val("").focus();
			$("#Ano_Documento").val("");
			$("#Numero_Documento").val("");
			//$("#Digito_DamInf").val("");
		}
		
	</script>
