<script language="javascript">
function testaForm(n,o)
{
    if (n=='Consultar')

	      && (document.flocal.nome.value =="") && (document.flocal.logradouro.value =="") && (document.flocal.num_porta.value ==""))
      {
     	  alert("Informe algum parâmetro para a consulta!");
          document.flocal.num_hab.focus();
	      return false;
      }
    }
    document.flocal.acao.value = n;
    document.flocal.submit();
    return true;
}
